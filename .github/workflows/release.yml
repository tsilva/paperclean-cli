name: Release

on:
  push:
    tags:
      - "paperclean-cli-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.13"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: uv sync --frozen --all-groups
      - if: startsWith(github.ref, 'refs/tags/')
        run: >-
          uv run python .codex/skills/build-release/scripts/release_build.py
          check-tag --tag "$GITHUB_REF_NAME"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy -p paperclean
      - run: uv run pytest

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.13"
      - run: uv sync --frozen --all-groups
      - run: uv build --clear --no-sources
      - run: uv run twine check dist/*
      - run: >-
          uv run python .codex/skills/build-release/scripts/release_build.py
          audit-dist --dist-dir dist
      - name: Smoke-test wheel
        run: |
          wheel="$(find dist -maxdepth 1 -name 'paperclean_cli-*-py3-none-any.whl' -print -quit)"
          test -n "$wheel"
          uv run python .codex/skills/build-release/scripts/release_build.py \
            smoke-wheel --wheel "$wheel"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/paperclean-cli-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, 2026-07-28
        with:
          packages-dir: dist/

  github-release:
    if: startsWith(github.ref, 'refs/tags/paperclean-cli-v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
