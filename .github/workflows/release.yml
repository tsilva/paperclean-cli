name: Release

on:
  push:
    tags:
      - "paperclean-cli-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Exact main commit to validate
        required: true
        type: string

permissions:
  contents: read

env:
  UV_CONFIG_FILE: ${{ github.workspace }}/uv-tool.toml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Verify source identity
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.ref || github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$REQUESTED"
          if [ "$EVENT" = workflow_dispatch ]; then
            test "$DISPATCH_REF" = refs/heads/main
            [[ "$REQUESTED" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$REQUESTED" origin/main
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.13"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: uv lock --check
      - run: uv sync --frozen --all-groups
      - if: startsWith(github.ref, 'refs/tags/')
        run: >-
          uv run python .codex/skills/build-release/scripts/release_build.py
          check-tag --tag "$GITHUB_REF_NAME"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy -p paperclean
      - run: uv run pytest

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Verify source identity
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.ref || github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$REQUESTED"
          if [ "$EVENT" = workflow_dispatch ]; then
            test "$DISPATCH_REF" = refs/heads/main
            [[ "$REQUESTED" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$REQUESTED" origin/main
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.13"
      - run: uv lock --check
      - run: uv sync --frozen --all-groups
      - run: uv build --clear --no-sources
      - run: uv run twine check dist/*
      - run: >-
          uv run python .codex/skills/build-release/scripts/release_build.py
          audit-dist --dist-dir dist
      - name: Smoke-test wheel
        run: |
          wheel="$(find dist -maxdepth 1 -name 'paperclean_cli-*-py3-none-any.whl' -print -quit)"
          test -n "$wheel"
          uv run python .codex/skills/build-release/scripts/release_build.py \
            smoke-wheel --wheel "$wheel"
      - run: sha256sum dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/paperclean-cli-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, 2026-07-28
        with:
          packages-dir: dist/

  github-release:
    if: startsWith(github.ref, 'refs/tags/paperclean-cli-v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release source for notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Generate release notes from committed changes
        shell: bash
        run: |
          python3 .codex/skills/build-release/scripts/release_notes.py \
            --version "${GITHUB_REF_NAME#paperclean-cli-v}" --tag-prefix "paperclean-cli-v" \
            --ref "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md"

  verify-artifacts:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Audit downloaded distributions
        run: python .codex/skills/build-release/scripts/release_build.py audit-dist --dist-dir dist
      - name: Smoke-test downloaded wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name 'paperclean_cli-*-py3-none-any.whl' -print -quit)"
          test -n "$wheel"
          python .codex/skills/build-release/scripts/release_build.py smoke-wheel --wheel "$wheel"
